<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Barcode Battler Unit Test Runner</title>
  <style>
    body { font-family: sans-serif; background: #121420; color: #fff; padding: 20px; }
    .test-item { padding: 10px; margin: 6px 0; border-radius: 6px; }
    .PASSED { background: #1b4d2e; border: 1px solid #32cd32; }
    .FAILED { background: #4d1b1b; border: 1px solid #ff4500; }
  </style>
</head>
<body>
  <h1>🧪 Barcode Battler Unit Test Runner</h1>
  <div id="test-results">実行中...</div>

  <script type="module">
    import { runAllTests } from './unit-tests.js';

    document.addEventListener('DOMContentLoaded', () => {
      const results = runAllTests();
      const container = document.getElementById('test-results');
      container.innerHTML = "";

      let passedCount = 0;
      results.forEach(r => {
        if (r.status === 'PASSED') passedCount++;
        const div = document.createElement('div');
        div.className = `test-item ${r.status}`;
        div.textContent = `[${r.status}] ${r.name}`;
        container.appendChild(div);
      });

      const summary = document.createElement('h2');
      summary.textContent = `結果: ${passedCount} / ${results.length} PASSED`;
      container.insertBefore(summary, container.firstChild);
    });
  </script>
</body>
</html>
