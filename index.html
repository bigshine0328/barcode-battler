<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バーコードバトラー (プロトタイプ版)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="app-container">

    <!-- SCR-01: ホーム画面 -->
    <section id="SCR-01" class="screen active">
      <header>
        <div>
          <h1 class="logo">⚡ バーコードバトラー</h1>
          <span class="version-tag">v1.0.6</span>
        </div>
        <div id="home-count-badge" class="counter-badge">しょじ 0/100</div>
      </header>

      <div style="margin-top: 10px; font-size: 0.85rem; font-weight: 800; color: var(--secondary-cyan); text-align: center;">
        ⚔️ げんざいの「しゅつげきメインキャラ」
      </div>

      <div id="home-showcase" class="char-showcase">
        <div style="color: var(--text-muted);">バーコードを スキャンして<br>キャラを ゲットしよう！</div>
      </div>

      <button id="btn-nav-scan" class="btn btn-primary" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-02');">📷 バーコードをすきゃん！</button>
      <div class="btn-group">
        <button id="btn-nav-deck" class="btn btn-secondary" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-04');">📖 ずかん・デッキへんせい</button>
        <button id="btn-nav-battle" class="btn btn-gold" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-05');">⚔️ たいせんロビー</button>
      </div>
    </section>

    <!-- SCR-02: スキャン画面 -->
    <section id="SCR-02" class="screen">
      <header>
        <button id="btn-stop-camera-back" class="btn-back-home" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-01');" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">← もどる</button>
        <h1 class="logo" style="font-size:1.1rem;">📷 バーコードスキャン</h1>
      </header>

      <div id="camera-status-msg" style="text-align: center; margin: 10px 0 6px 0; font-size: 0.9rem; color: var(--secondary-cyan);">
        バーコードを わくの中に あわせよう！
      </div>

      <div class="camera-box">
        <video id="scan-video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="scan-canvas" style="display: none;"></canvas>
        <div class="scan-laser"></div>
      </div>

      <button id="btn-start-camera" class="btn btn-secondary" style="margin-top: 10px; font-size: 0.95rem; min-height: 46px;">
        🎥 カメラを き動する
      </button>

      <div class="demo-barcode-section">
        <div style="font-size: 0.85rem; font-weight: 800;">🧪 テスト用バーコード（カメラがない環境用）</div>
        <div class="demo-btn-grid">
          <button class="demo-btn btn-demo-barcode" data-code="4901234567890">🍫 おかしの箱 (火)</button>
          <button class="demo-btn btn-demo-barcode" data-code="4909876543210">🧃 ジュースの缶 (水)</button>
          <button class="demo-btn btn-demo-barcode" data-code="4901111222233">✏️ ノート (木)</button>
          <button class="demo-btn btn-demo-barcode" data-code="4908888777766">🎁 レアアイテム</button>
        </div>

        <div style="margin-top: 10px; display: flex; gap: 6px;">
          <input type="text" id="input-manual-barcode" class="memo-input" placeholder="JANコードを直接入力 (例: 4901234...)" style="margin:0; font-size:0.85rem;">
          <button id="btn-manual-scan" class="btn btn-secondary" style="width: auto; min-height:44px; margin:0; font-size:0.9rem;">けってい</button>
        </div>
      </div>
    </section>

    <!-- SCR-03: スキャン結果画面 -->
    <section id="SCR-03" class="screen">
      <header>
        <h1 class="logo">✨ スキャンせいか</h1>
      </header>

      <div id="scan-result-card" class="char-showcase"></div>

      <input type="text" id="scanned-memo-input" class="memo-input" placeholder="📝 商品名やメモを入力（例: ポテトチップス）">

      <button id="btn-save-scanned" class="btn btn-primary">📖 ずかんに ほぞんする</button>
      <button class="btn btn-dark btn-back-home" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-01');">🏠 ホームへ もどる</button>
    </section>

    <!-- SCR-04: 図鑑 & デッキ画面 -->
    <section id="SCR-04" class="screen">
      <header>
        <button class="btn-back-home" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-01');" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">← もどる</button>
        <h1 class="logo" style="font-size:1.1rem;">📖 ずかん・デッキ</h1>
      </header>

      <div id="view-collection-tab" style="display: flex; flex-direction: column; flex: 1;">
        <div id="collection-grid-container" class="collection-grid" style="margin-top:10px;"></div>
      </div>
    </section>

    <!-- SCR-05: 対戦ロビー画面 -->
    <section id="SCR-05" class="screen">
      <header>
        <button class="btn-back-home" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-01');" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">← もどる</button>
        <h1 class="logo" style="font-size:1.1rem;">⚔️ 対戦ロビー</h1>
      </header>

      <div id="lobby-select-view" style="margin-top: 10px;">
        <div style="margin-top: 16px; text-align: center;">
          <button id="btn-cpu-battle" class="btn btn-gold">🤖 ひとりで CPU対戦テスト</button>
        </div>
      </div>
    </section>

    <!-- SCR-06: バトル画面 -->
    <section id="SCR-06" class="screen">
      <header style="padding-bottom: 6px;">
        <h1 class="logo" style="font-size: 1rem;">⚔️ バトル</h1>
        <button id="btn-battle-escape" class="btn btn-dark" onclick="if(window.appSwitchScreen) window.appSwitchScreen('SCR-05');" style="width: auto; min-height: 36px; padding: 4px 12px; font-size: 0.8rem; margin: 0;">
          🏃 にげる
        </button>
      </header>

      <div class="battle-stage">
        <!-- 敵情報 -->
        <div class="fighter-bar enemy-bar">
          <div style="display:flex; justify-content: space-between; align-items:center;">
            <span style="font-weight: 900; font-size: 0.8rem; background: #ff3366; color: #fff; padding: 2px 8px; border-radius: 8px; margin-right: 6px;">🔴 あいて (ENEMY)</span>
            <span id="e-name" style="font-weight: 800; font-size: 0.9rem;">???</span>
            <span id="e-hp-num" style="font-size: 0.8rem; color: var(--secondary-cyan); margin-left: auto;">1000/1000</span>
          </div>
          <div class="hp-gauge-bg"><div id="e-hp-bar" class="hp-gauge-fill"></div></div>
          <div class="sp-gauge-bg"><div id="e-sp-bar" class="sp-gauge-fill"></div></div>
        </div>

        <!-- バトルアリーナ -->
        <div class="battle-arena">
          <div class="arena-char">
            <div id="p-sprite" class="mini-sprite" style="width:85px; height:85px;"></div>
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--secondary-cyan); margin-top: 4px;">🟢 あなた</div>
          </div>
          <div style="font-family: var(--font-arcade); font-size: 1.3rem; color: var(--primary-pink);">VS</div>
          <div class="arena-char">
            <div id="e-sprite" class="mini-sprite" style="width:85px; height:85px;"></div>
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--primary-pink); margin-top: 4px;">🔴 あいて</div>
          </div>
        </div>

        <!-- 自分情報 -->
        <div class="fighter-bar player-bar">
          <div style="display:flex; justify-content: space-between; align-items:center;">
            <span style="font-weight: 900; font-size: 0.8rem; background: #00e5ff; color: #000; padding: 2px 8px; border-radius: 8px; margin-right: 6px;">🟢 あなた (YOU)</span>
            <span id="p-name" style="font-weight: 800; font-size: 0.9rem;">???</span>
            <span id="p-hp-num" style="font-size: 0.8rem; color: var(--secondary-cyan); margin-left: auto;">1000/1000</span>
          </div>
          <div class="hp-gauge-bg"><div id="p-hp-bar" class="hp-gauge-fill"></div></div>
          <div class="sp-gauge-bg"><div id="p-sp-bar" class="sp-gauge-fill"></div></div>
        </div>

        <!-- バトルログ -->
        <div id="battle-log" class="battle-log-box">
          <div>⚔️ バトルが はじまった！</div>
        </div>

        <!-- コマンドボタン -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px;">
          <button id="btn-cmd-attack" class="btn btn-primary" style="margin:0; min-height:44px; font-size:0.85rem;">⚔️ こうげき</button>
          <button id="btn-cmd-skill" class="btn btn-secondary" style="margin:0; min-height:44px; font-size:0.85rem;">✨ ひっさつ</button>
          <button id="btn-cmd-guard" class="btn btn-dark" style="margin:0; min-height:44px; font-size:0.85rem;">🛡️ ガード</button>
          <button id="btn-cmd-item" class="btn btn-dark" style="margin:0; min-height:44px; font-size:0.85rem;">💊 アイテム</button>
        </div>
      </div>
    </section>

    <!-- 全画面共通フッター (バージョン表示) -->
    <div style="position: absolute; bottom: 4px; right: 10px; font-size: 0.68rem; color: rgba(255,255,255,0.3); font-family: var(--font-arcade); pointer-events: none; z-index: 10;">
      VER 1.0.6 (Build 20260813.04)
    </div>

  </div>

  <!-- スクリプト統合読み込み -->
  <script src="src/js/bundle.js"></script>
</body>
</html>
